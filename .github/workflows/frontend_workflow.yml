name: Build Frontend

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: |
          cd swar-perfect-website
          npm ci

      - run: |
          cd swar-perfect-website
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: swar-perfect-website/dist